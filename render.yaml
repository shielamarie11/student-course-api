services:
  - type: web
    name: campus-connect-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_PATH
        value: /data/database.db
    disk:
      name: campus-connect-data
      mountPath: /data
      sizeGB: 1